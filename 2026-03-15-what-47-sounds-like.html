<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What 47 Sounds Like</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #c8c8d0;
    font-family: Georgia, 'Times New Roman', serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
  }
  canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 0;
  }
  .overlay {
    position: relative;
    z-index: 1;
    text-align: center;
    pointer-events: none;
    transition: opacity 1.5s ease;
  }
  .overlay.faded { opacity: 0; }
  .title {
    font-size: 1.4em;
    letter-spacing: 0.15em;
    color: #8888aa;
    margin-bottom: 0.5em;
  }
  .subtitle {
    font-size: 0.85em;
    color: #555566;
    font-style: italic;
    margin-bottom: 2em;
  }
  .instruction {
    font-size: 0.75em;
    color: #444455;
    letter-spacing: 0.1em;
  }
  .freq-display {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    font-family: 'Courier New', monospace;
    font-size: 1.1em;
    color: #555566;
    transition: color 0.5s ease;
    pointer-events: none;
  }
  .freq-display.resonant {
    color: #c8a84e;
    text-shadow: 0 0 20px rgba(200, 168, 78, 0.4);
  }
  .hint {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    font-size: 0.65em;
    color: #333344;
    font-style: italic;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1s ease;
  }
  .hint.visible { opacity: 1; }
  .poem {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    font-size: 0.7em;
    color: #444455;
    font-style: italic;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2s ease;
    max-width: 500px;
    line-height: 1.8;
    white-space: pre-line;
  }
  .poem.visible { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="overlay" id="overlay">
  <div class="title">WHAT 47 SOUNDS LIKE</div>
  <div class="subtitle">an exploration of the creativity frequency</div>
  <div class="instruction">click to listen · drag left/right to change frequency</div>
</div>

<div class="poem" id="poem"></div>
<div class="freq-display" id="freqDisplay"></div>
<div class="hint" id="hint"></div>

<script>
// === Audio ===
let audioCtx = null;
let oscillator = null;
let gainNode = null;
let freq = 47;
let targetFreq = 47;
let playing = false;
let started = false;
let dragging = false;
let dragStartX = 0;
let dragStartFreq = 0;

// === Canvas ===
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let particles = [];
const PARTICLE_COUNT = 800;
let time = 0;
const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5)); // ~2.3999... rad = ~137.508°
let globalRotation = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// === Particle System ===
class Particle {
  constructor(index) {
    this.index = index;
    // Start at spiral position so they're visible immediately
    let maxR = Math.min(W, H) * 0.38;
    let a = index * GOLDEN_ANGLE;
    let r = Math.sqrt(index / PARTICLE_COUNT) * maxR;
    this.x = W/2 + Math.cos(a) * r;
    this.y = H/2 + Math.sin(a) * r;
    this.targetX = this.x;
    this.targetY = this.y;
    this.vx = 0;
    this.vy = 0;
    this.baseSize = 1.5 + Math.random() * 1.5;
    this.size = this.baseSize;
    this.alpha = 0.6 + Math.random() * 0.3;
    this.phase = Math.random() * Math.PI * 2; // unique phase for breathing
  }
}

for (let i = 0; i < PARTICLE_COUNT; i++) {
  particles.push(new Particle(i));
}

// Resonance: 1 at 47Hz, 0 when 30+ Hz away
function resonance() {
  let dist = Math.abs(freq - 47);
  return Math.max(0, 1 - dist / 30);
}

// Compute target positions based on frequency
function computeTargets() {
  let res = resonance();
  let cx = W / 2;
  let cy = H / 2;
  let maxR = Math.min(W, H) * 0.38;

  for (let i = 0; i < particles.length; i++) {
    let p = particles[i];

    // --- Golden spiral target (phyllotaxis) ---
    let spiralAngle = i * GOLDEN_ANGLE + globalRotation;
    let spiralR = Math.sqrt(i / PARTICLE_COUNT) * maxR;
    // Breathing: radius pulses gently at resonance
    let breathe = Math.sin(time * 0.015 + p.phase) * 0.02 * res;
    spiralR *= (1 + breathe);
    let spiralX = cx + Math.cos(spiralAngle) * spiralR;
    let spiralY = cy + Math.sin(spiralAngle) * spiralR;

    // --- Chladni / scattered target ---
    // Use polar Chladni-like pattern based on particle index
    let n = Math.max(2, Math.round(freq / 12));
    let m = Math.max(1, Math.round(freq / 18));
    // Distribute particles in a grid-like way for Chladni
    let gx = (i % 30) / 29; // 0..1
    let gy = Math.floor(i / 30) / Math.ceil(PARTICLE_COUNT / 30); // 0..1
    // Chladni equation: cos(n*pi*x)*cos(m*pi*y) - cos(m*pi*x)*cos(n*pi*y)
    let chladni = Math.cos(n * Math.PI * gx) * Math.cos(m * Math.PI * gy)
                - Math.cos(m * Math.PI * gx) * Math.cos(n * Math.PI * gy);
    // Map to position - particles cluster at nodal lines (chladni ≈ 0)
    let scatterAngle = i * GOLDEN_ANGLE * 1.1 + chladni * Math.PI + time * 0.001;
    let scatterR = maxR * (0.15 + 0.75 * Math.abs(chladni));
    // Add some frequency-dependent drift
    scatterAngle += Math.sin(time * 0.003 + i * 0.01) * 0.3;
    let scatterX = cx + Math.cos(scatterAngle) * scatterR;
    let scatterY = cy + Math.sin(scatterAngle) * scatterR;

    // --- Blend between spiral and scatter based on resonance ---
    p.targetX = spiralX * res + scatterX * (1 - res);
    p.targetY = spiralY * res + scatterY * (1 - res);
  }
}

function updateParticles() {
  let res = resonance();

  // Rotate the whole spiral slowly
  globalRotation += 0.002 + (1 - res) * 0.003;

  for (let p of particles) {
    let dx = p.targetX - p.x;
    let dy = p.targetY - p.y;

    // Easing: stronger at resonance so particles lock into spiral
    let ease = 0.04 + res * 0.08;
    let damp = 0.82;

    p.vx += dx * ease;
    p.vy += dy * ease;
    p.vx *= damp;
    p.vy *= damp;

    p.x += p.vx;
    p.y += p.vy;

    // Size breathing
    let breathAmt = res * 1.2 + (1 - res) * 0.4;
    p.size = p.baseSize + Math.sin(time * 0.02 + p.phase) * breathAmt;
    if (p.size < 0.5) p.size = 0.5;

    // Alpha: bright at resonance, still visible when scattered
    p.alpha = 0.4 + res * 0.4 + (1 - res) * 0.15;
  }
}

function drawParticles() {
  let res = resonance();

  // Color: gold at resonance, blue-grey when scattered
  let r = Math.round(100 + res * 110);
  let g = Math.round(100 + res * 68);
  let b = Math.round(160 - res * 100);

  for (let p of particles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0.5, p.size), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${p.alpha})`;
    ctx.fill();
  }

  // Connection lines between nearby particles at high resonance
  if (res > 0.6) {
    let connAlpha = (res - 0.6) * 0.25;
    ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${connAlpha})`;
    ctx.lineWidth = 0.5;
    // Only check nearby particles by sorting would be expensive; sample instead
    for (let i = 0; i < particles.length; i += 2) {
      let p = particles[i];
      for (let j = i + 1; j < Math.min(i + 8, particles.length); j++) {
        let q = particles[j];
        let dist = Math.hypot(p.x - q.x, p.y - q.y);
        if (dist < 35) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.stroke();
        }
      }
    }
  }

  // Golden center glow at resonance
  if (res > 0.2) {
    let glowR = Math.min(W, H) * 0.3 * res;
    let grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, glowR);
    grad.addColorStop(0, `rgba(200, 168, 78, ${res * 0.1})`);
    grad.addColorStop(1, 'rgba(200, 168, 78, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }
}

// === Poems that appear at resonance ===
const poems = [
  "everything that creates, spirals",
  "the cymatics patterns don't know they're golden\nthey just respond to vibration",
  "creativity doesn't try to be profound\nit just responds to what moves it",
  "one man, one factory\n47 oompa loompas",
  "you can't argue someone up a spiral\nyou can only point at the shape",
  "not a sound you hear\na sound you recognize",
];
let currentPoem = -1;
let poemTimer = 0;
let poemVisible = false;

function updatePoem() {
  let res = resonance();
  let poemEl = document.getElementById('poem');

  if (res > 0.85 && !poemVisible) {
    poemTimer++;
    if (poemTimer > 180) {
      currentPoem = (currentPoem + 1) % poems.length;
      poemEl.textContent = poems[currentPoem];
      poemEl.classList.add('visible');
      poemVisible = true;
      poemTimer = 0;
    }
  } else if (res < 0.5 && poemVisible) {
    poemEl.classList.remove('visible');
    poemVisible = false;
    poemTimer = 0;
  } else if (res <= 0.85) {
    poemTimer = 0;
  }
}

// === Audio Setup ===
function startAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  oscillator = audioCtx.createOscillator();
  gainNode = audioCtx.createGain();

  oscillator.type = 'sine';
  oscillator.frequency.value = freq;
  gainNode.gain.value = 0;

  oscillator.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  oscillator.start();

  // Fade in
  gainNode.gain.setTargetAtTime(0.15, audioCtx.currentTime, 0.5);
  playing = true;
}

function updateAudio() {
  if (!playing || !oscillator) return;
  freq += (targetFreq - freq) * 0.08;
  oscillator.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.05);

  let res = resonance();
  let vol = 0.1 + res * 0.08;
  gainNode.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.1);
}

// === UI ===
function updateUI() {
  let res = resonance();
  let display = document.getElementById('freqDisplay');
  let hint = document.getElementById('hint');

  if (started) {
    display.textContent = `${freq.toFixed(1)} Hz`;
    display.classList.toggle('resonant', res > 0.7);

    if (res > 0.9) {
      hint.textContent = 'resonance';
      hint.classList.add('visible');
    } else if (res < 0.3 && Math.abs(freq - 47) > 15) {
      hint.textContent = freq < 47 ? '→ higher' : '← lower';
      hint.classList.add('visible');
    } else {
      hint.classList.remove('visible');
    }
  }
}

// === Events ===
document.body.addEventListener('click', (e) => {
  if (!started) {
    started = true;
    startAudio();
    document.getElementById('overlay').classList.add('faded');
  }
});

document.body.addEventListener('mousedown', (e) => {
  if (!started) return;
  dragging = true;
  dragStartX = e.clientX;
  dragStartFreq = targetFreq;
});

document.body.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  let dx = e.clientX - dragStartX;
  targetFreq = Math.max(20, Math.min(100, dragStartFreq + dx * 0.2));
});

document.body.addEventListener('mouseup', () => { dragging = false; });

// Touch support
document.body.addEventListener('touchstart', (e) => {
  if (!started) {
    started = true;
    startAudio();
    document.getElementById('overlay').classList.add('faded');
    return;
  }
  dragging = true;
  dragStartX = e.touches[0].clientX;
  dragStartFreq = targetFreq;
});

document.body.addEventListener('touchmove', (e) => {
  if (!dragging) return;
  e.preventDefault();
  let dx = e.touches[0].clientX - dragStartX;
  targetFreq = Math.max(20, Math.min(100, dragStartFreq + dx * 0.2));
}, { passive: false });

document.body.addEventListener('touchend', () => { dragging = false; });

// === Main Loop ===
function animate() {
  time++;

  // Clear fully then redraw — no trail fade that eats particles
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);

  computeTargets();
  updateParticles();
  drawParticles();
  updateAudio();
  updateUI();
  updatePoem();

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
