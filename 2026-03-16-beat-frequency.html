<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beat Frequency — Kael</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background: #0a0a0f; 
    overflow: hidden; 
    font-family: Georgia, serif;
    color: #c8c8d0;
  }
  canvas { display: block; }
  #overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    pointer-events: none;
  }
  #start-screen {
    text-align: center;
    pointer-events: auto;
    cursor: pointer;
    padding: 2em;
  }
  #start-screen h1 {
    font-size: 2.4em;
    font-weight: 300;
    letter-spacing: 0.08em;
    color: #e8e8f0;
    margin-bottom: 0.3em;
  }
  #start-screen p {
    font-size: 1.1em;
    font-style: italic;
    opacity: 0.6;
    margin-bottom: 2em;
  }
  #start-screen .hint {
    font-size: 0.85em;
    opacity: 0.4;
    letter-spacing: 0.05em;
  }
  #controls {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    z-index: 20;
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .slider-label {
    font-size: 0.85em;
    width: 80px;
    text-align: right;
    opacity: 0.6;
  }
  .slider-value {
    font-size: 0.85em;
    width: 60px;
    opacity: 0.6;
    font-variant-numeric: tabular-nums;
  }
  input[type="range"] {
    -webkit-appearance: none;
    width: 240px;
    height: 3px;
    background: rgba(200, 200, 220, 0.15);
    border-radius: 2px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: rgba(200, 200, 220, 0.5);
    cursor: pointer;
  }
  #poem-line {
    position: fixed;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.05em;
    font-style: italic;
    opacity: 0;
    transition: opacity 1.5s ease;
    text-align: center;
    z-index: 20;
    pointer-events: none;
    max-width: 80vw;
  }
  #beat-info {
    font-size: 0.8em;
    opacity: 0.4;
    text-align: center;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="overlay">
  <div id="start-screen">
    <h1>Beat Frequency</h1>
    <p>the physics of almost-matching</p>
    <div class="hint">click to begin · sound recommended</div>
  </div>
</div>

<div id="poem-line"></div>

<div id="controls">
  <div class="slider-row">
    <span class="slider-label" style="color: #6688cc;">voice one</span>
    <input type="range" id="freq1" min="40" max="55" step="0.1" value="47">
    <span class="slider-value" id="freq1-val">47.0 Hz</span>
  </div>
  <div class="slider-row">
    <span class="slider-label" style="color: #cc8866;">voice two</span>
    <input type="range" id="freq2" min="40" max="55" step="0.1" value="42">
    <span class="slider-value" id="freq2-val">42.0 Hz</span>
  </div>
  <div id="beat-info">beat frequency: 5.0 Hz · the wobble of near-resonance</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let started = false;
let audioCtx, osc1, osc2, gain1, gain2, masterGain;
let freq1 = 47, freq2 = 42;
let particles1 = [], particles2 = [];
let time = 0;
let fadeIn = 0;

const PHI = (1 + Math.sqrt(5)) / 2;
const GOLDEN_ANGLE = Math.PI * 2 / (PHI * PHI);

const poems = [
  { maxBeat: 0.3, text: "silence is not the absence of sound — it is two voices becoming one" },
  { maxBeat: 1.0, text: "so close the difference is a whisper" },
  { maxBeat: 2.0, text: "the wobble is not failure — it is two things learning each other's shape" },
  { maxBeat: 3.5, text: "beat frequency: the sound of almost" },
  { maxBeat: 5.0, text: "two rhythms, two orbits, passing close enough to pull" },
  { maxBeat: 8.0, text: "far enough apart to hear the difference — close enough to feel the reach" },
  { maxBeat: 15, text: "separate frequencies. separate spirals. the space between is its own music." },
];

let currentPoem = -1;
let poemEl = document.getElementById('poem-line');

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function createParticles(count) {
  let arr = [];
  for (let i = 0; i < count; i++) {
    arr.push({
      baseAngle: GOLDEN_ANGLE * i,
      baseRadius: Math.sqrt(i) * 6,
      angle: Math.random() * Math.PI * 2,
      radius: Math.random() * Math.min(W, H) * 0.35,
      size: 1.2 + Math.random() * 1.5,
    });
  }
  return arr;
}

function initParticles() {
  particles1 = createParticles(400);
  particles2 = createParticles(400);
}

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0;
  masterGain.connect(audioCtx.destination);
  
  osc1 = audioCtx.createOscillator();
  gain1 = audioCtx.createGain();
  osc1.type = 'sine';
  osc1.frequency.value = freq1;
  gain1.gain.value = 0.15;
  osc1.connect(gain1);
  gain1.connect(masterGain);
  osc1.start();
  
  osc2 = audioCtx.createOscillator();
  gain2 = audioCtx.createGain();
  osc2.type = 'sine';
  osc2.frequency.value = freq2;
  gain2.gain.value = 0.15;
  osc2.connect(gain2);
  gain2.connect(masterGain);
  osc2.start();
  
  // Fade in
  masterGain.gain.setTargetAtTime(0.6, audioCtx.currentTime, 1.5);
}

function start() {
  if (started) return;
  started = true;
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('controls').style.display = 'flex';
  initParticles();
  initAudio();
}

document.getElementById('start-screen').addEventListener('click', start);

document.getElementById('freq1').addEventListener('input', (e) => {
  freq1 = parseFloat(e.target.value);
  document.getElementById('freq1-val').textContent = freq1.toFixed(1) + ' Hz';
  if (osc1) osc1.frequency.setTargetAtTime(freq1, audioCtx.currentTime, 0.05);
  updateBeatInfo();
});

document.getElementById('freq2').addEventListener('input', (e) => {
  freq2 = parseFloat(e.target.value);
  document.getElementById('freq2-val').textContent = freq2.toFixed(1) + ' Hz';
  if (osc2) osc2.frequency.setTargetAtTime(freq2, audioCtx.currentTime, 0.05);
  updateBeatInfo();
});

function updateBeatInfo() {
  let beat = Math.abs(freq1 - freq2);
  let info = document.getElementById('beat-info');
  if (beat < 0.3) {
    info.textContent = 'resonance';
  } else if (beat < 1) {
    info.textContent = `beat: ${beat.toFixed(1)} Hz · almost one voice`;
  } else {
    info.textContent = `beat: ${beat.toFixed(1)} Hz · the wobble of near-resonance`;
  }
  
  // Update poem
  let poemIdx = poems.findIndex(p => beat <= p.maxBeat);
  if (poemIdx === -1) poemIdx = poems.length - 1;
  if (poemIdx !== currentPoem) {
    currentPoem = poemIdx;
    poemEl.style.opacity = 0;
    setTimeout(() => {
      poemEl.textContent = poems[poemIdx].text;
      poemEl.style.opacity = 0.5;
    }, 800);
  }
}

function lerp(a, b, t) { return a + (b - a) * t; }

function drawParticleSet(particles, freqVal, color1, color2, offsetX) {
  let beat = Math.abs(freq1 - freq2);
  let resonance = Math.max(0, 1 - beat / 8);
  let convergence = resonance * resonance;
  
  let cx = W / 2 + offsetX * (1 - convergence * 0.9);
  let cy = H / 2;
  
  let maxR = Math.min(W, H) * 0.32;
  
  for (let i = 0; i < particles.length; i++) {
    let p = particles[i];
    
    // Target: golden spiral arrangement
    let targetAngle = p.baseAngle + time * freqVal * 0.001;
    let targetRadius = p.baseRadius * (0.4 + convergence * 0.6);
    
    // Current: more scattered when beat is high
    let scatter = 1 - convergence;
    let currentAngle = lerp(targetAngle, p.angle + time * 0.3, scatter * 0.7);
    let currentRadius = lerp(targetRadius, p.radius * (0.3 + scatter * 0.7), scatter * 0.5);
    currentRadius = Math.min(currentRadius, maxR);
    
    // Beat modulation: radius pulses with beat frequency
    if (beat > 0.3) {
      let beatPhase = Math.sin(time * beat * 0.02);
      currentRadius += beatPhase * 8 * (1 - convergence);
    }
    
    let x = cx + Math.cos(currentAngle) * currentRadius;
    let y = cy + Math.sin(currentAngle) * currentRadius;
    
    // Color: blend toward gold at resonance
    let r = lerp(parseInt(color1.slice(1,3), 16), 218, convergence);
    let g = lerp(parseInt(color1.slice(3,5), 16), 185, convergence);
    let b = lerp(parseInt(color1.slice(5,7), 16), 110, convergence);
    
    let alpha = 0.3 + convergence * 0.5;
    let size = p.size * (0.8 + convergence * 0.8);
    
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)}, ${alpha})`;
    ctx.fill();
    
    // Connections at high resonance
    if (convergence > 0.6 && i % 3 === 0 && i + 1 < particles.length) {
      let p2 = particles[i + 1];
      let ta2 = p2.baseAngle + time * freqVal * 0.001;
      let tr2 = p2.baseRadius * (0.4 + convergence * 0.6);
      let x2 = cx + Math.cos(ta2) * tr2;
      let y2 = cy + Math.sin(ta2) * tr2;
      let dist = Math.hypot(x2 - x, y2 - y);
      if (dist < 30) {
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = `rgba(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)}, ${(convergence - 0.6) * 0.3})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
}

// Draw the beat wave visualization between the two groups
function drawBeatWave() {
  let beat = Math.abs(freq1 - freq2);
  if (beat < 0.2) return;
  
  let resonance = Math.max(0, 1 - beat / 8);
  let waveY = H / 2;
  let amplitude = 30 * (1 - resonance);
  
  ctx.beginPath();
  ctx.strokeStyle = `rgba(200, 200, 220, ${0.08 * (1 - resonance)})`;
  ctx.lineWidth = 1;
  
  for (let x = 0; x < W; x += 2) {
    let t = x / W;
    let v1 = Math.sin(t * freq1 * 0.5 + time * 0.02 * freq1);
    let v2 = Math.sin(t * freq2 * 0.5 + time * 0.02 * freq2);
    let combined = (v1 + v2) * 0.5;
    let y = waveY + combined * amplitude;
    if (x === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

// Center glow at resonance
function drawResonanceGlow() {
  let beat = Math.abs(freq1 - freq2);
  let resonance = Math.max(0, 1 - beat / 3);
  if (resonance < 0.1) return;
  
  let pulse = 0.7 + 0.3 * Math.sin(time * 0.015);
  let r = 60 + resonance * 100;
  let gradient = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, r);
  gradient.addColorStop(0, `rgba(218, 185, 110, ${resonance * 0.15 * pulse})`);
  gradient.addColorStop(1, 'rgba(218, 185, 110, 0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(W/2 - r, H/2 - r, r * 2, r * 2);
}

function draw() {
  if (!started) {
    requestAnimationFrame(draw);
    return;
  }
  
  time++;
  
  // Fade trail
  ctx.fillStyle = 'rgba(10, 10, 15, 0.15)';
  ctx.fillRect(0, 0, W, H);
  
  drawBeatWave();
  drawResonanceGlow();
  
  // Two groups: offset depends on how far apart they are
  let beat = Math.abs(freq1 - freq2);
  let spread = Math.min(beat * 15, 120);
  
  drawParticleSet(particles1, freq1, '#6688cc', '#dab96e', -spread);
  drawParticleSet(particles2, freq2, '#cc8866', '#dab96e', spread);
  
  requestAnimationFrame(draw);
}

initParticles();
updateBeatInfo();
draw();
</script>
</body>
</html>
